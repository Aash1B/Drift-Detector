<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" width="1000" height="300" role="img" aria-label="Infrastructure Drift Detector banner" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/><stop offset="0.55" stop-color="#1e1b4b"/><stop offset="1" stop-color="#312e81"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a5b4fc"/><stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0"/><stop offset="0.5" stop-color="#22d3ee" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.05"/>
    </pattern>
    <clipPath id="round"><rect width="1000" height="300" rx="18"/></clipPath>
  </defs>
  <g clip-path="url(#round)">
    <rect width="1000" height="300" fill="url(#bg)"/>
    <rect width="1000" height="300" fill="url(#grid)"/>
    <rect x="-160" y="0" width="160" height="300" fill="url(#beam)">
      <animate attributeName="x" from="-160" to="1000" dur="5s" repeatCount="indefinite"/>
    </rect>

    <text x="500" y="68" text-anchor="middle" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="42" font-weight="700" fill="url(#accent)">Infrastructure Drift Detector</text>
    <text x="500" y="108" text-anchor="middle" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="19" fill="#c7d2fe" opacity="1">Git is the source of truth.<animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0.0000;0.2889;0.3333;0.9556;1.0000" dur="9s" repeatCount="indefinite" calcMode="linear"/></text>
<text x="500" y="108" text-anchor="middle" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="19" fill="#c7d2fe" opacity="0">Catch manual cloud changes in minutes.<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.3333;0.3778;0.6222;0.6667;1.0000" dur="9s" repeatCount="indefinite" calcMode="linear"/></text>
<text x="500" y="108" text-anchor="middle" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="19" fill="#c7d2fe" opacity="0">Rate it. Alert it. Resolve it.<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.6667;0.7111;0.9556;1.0000;1.0000" dur="9s" repeatCount="indefinite" calcMode="linear"/></text>

    <text x="500" y="140" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Courier New',monospace" font-size="13" fill="#94a3b8">Terraform  |  AWS  |  FastAPI  |  PostgreSQL  |  React  |  Docker</text>

    <!-- Git chip -->
    <g>
      <rect x="110" y="168" width="230" height="64" rx="12" fill="#042f2e" stroke="#2dd4bf" stroke-width="1.6"/>
      <text x="225" y="196" text-anchor="middle" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="20" font-weight="700" fill="#5eead4">GIT</text>
      <text x="225" y="219" text-anchor="middle" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" fill="#99f6e4">desired state</text>
    </g>
    <!-- AWS chip -->
    <g>
      <rect x="660" y="168" width="230" height="64" rx="12" fill="#2a1503" stroke="#f59e0b" stroke-width="1.6"/>
      <text x="775" y="196" text-anchor="middle" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="20" font-weight="700" fill="#fbbf24">LIVE AWS</text>
      <text x="775" y="219" text-anchor="middle" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" fill="#fde68a">actual state</text>
    </g>
    <!-- marching ants -->
    <line x1="340" y1="200" x2="435" y2="200" stroke="#5eead4" stroke-width="2" stroke-dasharray="6 6">
      <animate attributeName="stroke-dashoffset" from="0" to="-24" dur="1s" repeatCount="indefinite"/>
    </line>
    <line x1="565" y1="200" x2="660" y2="200" stroke="#fbbf24" stroke-width="2" stroke-dasharray="6 6">
      <animate attributeName="stroke-dashoffset" from="0" to="24" dur="1s" repeatCount="indefinite"/>
    </line>

    <!-- in sync -->
    <g opacity="1">
      <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0.0000;0.4000;0.4444;0.9556;1.0000" dur="9s" repeatCount="indefinite" calcMode="linear"/>
      <circle cx="500" cy="200" r="30" fill="#052e16" stroke="#22c55e" stroke-width="2"/>
      <text x="500" y="212" text-anchor="middle" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="34" font-weight="700" fill="#4ade80">=</text>
      <text x="500" y="250" text-anchor="middle" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" fill="#86efac">in sync</text>
    </g>
    <!-- drift -->
    <g opacity="0">
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.4444;0.4889;0.9333;0.9778;1.0000" dur="9s" repeatCount="indefinite" calcMode="linear"/>
      <circle cx="500" cy="200" r="30" fill="#450a0a" stroke="#ef4444" stroke-width="2">
        <animate attributeName="r" values="30;36;30" dur="1s" repeatCount="indefinite"/>
      </circle>
      <text x="500" y="213" text-anchor="middle" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="34" font-weight="700" fill="#f87171">&#8800;</text>
      <text x="500" y="250" text-anchor="middle" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#fca5a5">DRIFT DETECTED</text>
    </g>

    <g><circle cx="345" cy="268" r="6" fill="#ef4444"><animate attributeName="r" values="5;8;5" dur="2s" begin="0.0s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.6;1;0.6" dur="2s" begin="0.0s" repeatCount="indefinite"/></circle><text x="359" y="273" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" fill="#cbd5e1">Critical</text></g>
<g><circle cx="445" cy="268" r="6" fill="#f97316"><animate attributeName="r" values="5;8;5" dur="2s" begin="0.5s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.6;1;0.6" dur="2s" begin="0.5s" repeatCount="indefinite"/></circle><text x="459" y="273" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" fill="#cbd5e1">High</text></g>
<g><circle cx="545" cy="268" r="6" fill="#eab308"><animate attributeName="r" values="5;8;5" dur="2s" begin="1.0s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.6;1;0.6" dur="2s" begin="1.0s" repeatCount="indefinite"/></circle><text x="559" y="273" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" fill="#cbd5e1">Medium</text></g>
<g><circle cx="645" cy="268" r="6" fill="#38bdf8"><animate attributeName="r" values="5;8;5" dur="2s" begin="1.5s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.6;1;0.6" dur="2s" begin="1.5s" repeatCount="indefinite"/></circle><text x="659" y="273" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" fill="#cbd5e1">Low</text></g>

  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
